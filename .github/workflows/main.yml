name: Build MeiPlay EXE
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PySide6 pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --add-data "games;games" --collect-submodules games --name "MeiPlay" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: MeiPlay-Windows
          path: dist/MeiPlay.exe
